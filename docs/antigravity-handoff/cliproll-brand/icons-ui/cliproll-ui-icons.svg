<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- ClipRoll Mini-Icons Sprite (24x24, cohérents avec le Logo 4) -->

  <!-- 1. Étincelle IA (signature ClipRoll) -->
  <symbol id="cr-spark" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2L14.6 9.4L22 12L14.6 14.6L12 22L9.4 14.6L2 12L9.4 9.4L12 2Z"/>
  </symbol>

  <!-- 2. Mini-logo ClipRoll monochrome (barre clip + play) -->
  <symbol id="cr-mark" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="4" width="4.5" height="16" rx="2.25" fill="#00E5FF"/>
    <path d="M10.5 5.4C10.5 4.2 11.8 3.5 12.8 4.1L21 9.7C21.9 10.3 21.9 11.7 21 12.3L12.8 17.9C11.8 18.5 10.5 17.8 10.5 16.6V5.4Z" fill="#FF3B5C"/>
    <path d="M9 5.5L9.9 8.1L12.5 9L9.9 9.9L9 12.5L8.1 9.9L5.5 9L8.1 8.1L9 5.5Z" fill="#FFFFFF"/>
  </symbol>

  <!-- 3. Format Vertical 9:16 -->
  <symbol id="cr-vertical" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="2.5" width="12" height="19" rx="3"/>
    <path d="M10.5 9.5L15 12L10.5 14.5V9.5Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 4. Voix / TTS -->
  <symbol id="cr-voice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>
  </symbol>

  <!-- 5. Sous-titres dynamiques -->
  <symbol id="cr-captions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="3"/>
    <path d="M7 11h4M13 11h4M7 15h6M15 15h2"/>
  </symbol>

  <!-- 6. Export / Rendu 60fps -->
  <symbol id="cr-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/>
    <path d="M4 15v3.5A2.5 2.5 0 006.5 21h11a2.5 2.5 0 002.5-2.5V15"/>
  </symbol>

  <!-- 7. Montage / Cut -->
  <symbol id="cr-cut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6.5" cy="7.5" r="2.5"/>
    <circle cx="6.5" cy="16.5" r="2.5"/>
    <path d="M20 5L8.6 14.7M20 19L12.5 12.6M8.6 9.3L11 11.3"/>
  </symbol>

  <!-- 8. Script / Idée -->
  <symbol id="cr-script" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4.5A2.5 2.5 0 017.5 2H19v18H7.5A2.5 2.5 0 005 22V4.5z"/>
    <path d="M9 7h6M9 11h6M9 15h4"/>
  </symbol>
</svg>
